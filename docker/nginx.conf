server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'self'; base-uri 'self'" always;
    location /api/ {
        proxy_pass http://api:3000;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
